[general]
static = yes
writeprotect = no
clearglobalvars = no

;------------------------------------------------------------------------
; The whole call logic lives in the ARI Stasis application "outbound"
; (the Telegram bot). These contexts are thin entry points.
;------------------------------------------------------------------------

; Inbound calls arriving from the trunk are handed straight to the bot.
[from-trunk]
exten => _.,1,NoOp(Inbound from trunk: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(outbound,inbound)
 same => n,Hangup()

; Safety net context (should not normally be used).
[default]
exten => _.,1,Hangup()
