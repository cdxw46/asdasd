[modules]
autoload = yes

; Make sure the bits we depend on are loaded even if autoload is tweaked.
preload = res_pjsip.so
load = res_ari.so
load = res_ari_channels.so
load = res_ari_bridges.so
load = res_ari_playbacks.so
load = res_ari_recordings.so
load = res_stasis.so
load = app_stasis.so
load = res_pjsip.so
load = res_pjsip_session.so
load = chan_pjsip.so
load = format_wav.so
load = format_pcm.so

; We don't use chan_sip (deprecated) — keep it off.
noload = chan_sip.so
